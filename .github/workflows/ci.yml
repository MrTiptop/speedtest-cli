# MrTiptop
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Compile
        run: python -W error::DeprecationWarning -m py_compile speedtest.py
      - name: Version and help
        run: |
          python -W error::DeprecationWarning speedtest.py --version
          python -W error::DeprecationWarning speedtest.py --help > /dev/null
      - name: Server discovery
        run: |
          python -W error::DeprecationWarning speedtest.py --list | tee servers.txt
          test "$(grep -cE '^ *[0-9]+\)' servers.txt)" -gt 0
      - name: Install
        run: |
          python -m pip install .
          speedtest-cli --version

  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install flake8
      - run: flake8 speedtest.py setup.py
