[tox]
skipsdist=true
envlist = py310, py311, py312, py313, py314, py315, flake8

[testenv]
commands =
    {envpython} -V
    {envpython} -m compileall speedtest.py
    {envpython} speedtest.py
    {envpython} speedtest.py --source 172.17.0.1
    {envpython} tests/scripts/source.py

[testenv:flake8]
basepython=python3
deps=flake8
commands =
    {envpython} -V
    flake8 speedtest.py setup.py
